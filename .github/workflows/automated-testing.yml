name: Automated Testing

on:
  push:
    branches: [main, feature/*]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11"]
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements-test.txt
          python -m pip install pytest pytest-cov
      - name: Compile source and tests
        run: python -m compileall -q src tests
      - name: Run changed-component regression tests (blocking)
        run: >-
          python -m pytest tests/test_system_validator.py tests/test_system_optimizer.py
          --cov=src.core.system_validator --cov=src.core.system_optimizer
          --cov-report=xml
      - name: Run full legacy test suite audit (non-blocking; preserve failures)
        continue-on-error: true
        run: python -m pytest tests/ -q
