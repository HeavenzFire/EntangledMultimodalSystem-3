name: Code Quality

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  schedule:
    - cron: '0 0 * * 0'  # Weekly code quality check

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.11'
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install black flake8 isort mypy pylint
    - name: Run Black
      run: black . --check
    - name: Run Flake8
      run: flake8 .
    - name: Run isort
      run: isort . --check-only
    - name: Run MyPy
      run: mypy src/
    - name: Run Pylint
      run: pylint src/

  docs:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.11'
    - name: Validate static documentation
      run: |
        test -s docs/index.html
        test -s docs/ARCHITECTURE.md
        test -s docs/SECURITY.md
        find docs -type f -name '*.md' -size 0 -print -quit | grep -q . && {
          echo "Found an empty Markdown documentation file."
          exit 1
        } || true
    - name: Deploy documentation
      if: github.ref == 'refs/heads/main'
      uses: peaceiris/actions-gh-pages@v3
      with:
        github_token: ${{ secrets.GITHUB_TOKEN }}
        publish_dir: ./docs/_build/html 