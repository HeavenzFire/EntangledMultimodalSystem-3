name: Deploy IDE System

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Test static IDE page
        run: node --test tests/workflow-smoke.test.cjs

      - name: Build static site
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p dist
          cp src/ide_system/frontend/ide_interface.html dist/index.html
          test -s dist/index.html
          cmp src/ide_system/frontend/ide_interface.html dist/index.html

      - name: Upload static site artifact
        uses: actions/upload-artifact@v4
        with:
          name: static-ide-site
          path: dist/
          if-no-files-found: error
          retention-days: 1

  deploy:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: build-and-test
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download built site
        uses: actions/download-artifact@v4
        with:
          name: static-ide-site
          path: dist/

      - name: Verify deployment artifact
        run: test -s dist/index.html

      - name: Deploy to GitHub Pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./dist
          publish_branch: gh-pages
