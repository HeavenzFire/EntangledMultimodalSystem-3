name: Documentation

on:
  push:
    branches: [main]
    paths:
      - 'docs/**'
      - '.github/workflows/docs.yml'
  pull_request:
    branches: [main]
    paths:
      - 'docs/**'
      - '.github/workflows/docs.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate documentation entry point
        run: |
          test -s docs/index.html
          test -s docs/ARCHITECTURE.md
          test -s docs/SECURITY.md
      - name: Check for empty Markdown files
        run: |
          find docs -type f -name '*.md' -size 0 -print -quit | grep -q . && {
            echo "Found an empty Markdown documentation file."
            exit 1
          } || true
      - name: Deploy static documentation to GitHub Pages
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./docs
          publish_branch: gh-pages
