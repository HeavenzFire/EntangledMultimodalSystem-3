name: Omni Emulation Unit Smoke

on:
  pull_request:
    branches: [main]
    paths:
      - "src/metaphysical/mathematics/core/omni_emulation.py"
      - "tests/metaphysical/mathematics/core/test_omni_emulation_unit.py"
      - ".github/workflows/omni-emulation-smoke.yml"
  push:
    branches:
      - "fix/unified-ci-security-integration"
    paths:
      - "src/metaphysical/mathematics/core/omni_emulation.py"
      - "tests/metaphysical/mathematics/core/test_omni_emulation_unit.py"
      - ".github/workflows/omni-emulation-smoke.yml"

permissions:
  contents: read

jobs:
  unit-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install minimal legacy-compatible test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install "numpy<2" "qiskit==0.46.3" "qiskit-aer==0.13.3" Flask python-dotenv pytest
      - name: Run bounded local emulation regression tests
        run: python -m pytest -q tests/metaphysical/mathematics/core/test_omni_emulation_unit.py
