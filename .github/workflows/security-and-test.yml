name: Security and Test

on:
  push:
    branches: [main, feature/security-enhancements]
  pull_request:
    branches: [main, feature/security-enhancements]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11"]
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements-test.txt
          python -m pip install pytest pytest-cov
      - name: Run changed-component regression tests (blocking)
        run: >-
          python -m pytest tests/test_system_validator.py tests/test_system_optimizer.py
          --cov=src.core.system_validator --cov=src.core.system_optimizer
          --cov-report=xml
      - name: Audit legacy full-suite collection (non-blocking)
        continue-on-error: true
        run: python -m pytest tests/ --collect-only -q
