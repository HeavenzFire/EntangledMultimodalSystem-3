name: Security Scan

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    - cron: '0 0 * * *'

permissions:
  contents: read

jobs:
  security-scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install security tools and patched build tooling
        run: |
          python -m pip install --upgrade pip "setuptools>=83.0.0"
          python -m pip install safety bandit semgrep
      - name: Run Safety (Python dependency checker)
        run: safety check --full-report
      - name: Run Bandit (Python security linter)
        run: bandit -r src/ -ll
      - name: Run Semgrep
        run: semgrep --config auto src/
