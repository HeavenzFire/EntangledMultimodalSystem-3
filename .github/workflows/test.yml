name: Tests

on:
  push:
    branches: [main, feature/security-enhancements]
  pull_request:
    branches: [main, feature/security-enhancements]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11"]

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-test.txt
          pip install pytest pytest-cov

      - name: Run changed-component regression tests (blocking)
        run: |
          pytest tests/test_system_validator.py tests/test_system_optimizer.py \
            --cov=src.core.system_validator --cov=src.core.system_optimizer \
            --cov-report=xml

      - name: Audit legacy full-suite collection (non-blocking)
        continue-on-error: true
        run: pytest tests/ --collect-only -q

      - name: Upload focused coverage
        uses: codecov/codecov-action@v4
        with:
          files: ./coverage.xml
          fail_ci_if_error: false

      - name: Legacy MyPy audit (non-blocking baseline)
        continue-on-error: true
        run: |
          pip install mypy
          mypy src/

      - name: Incremental Python quality checks
        run: python scripts/check_changed_python.py
