name: Framework Validation

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install test dependencies
        run: |
          python -m pip install --upgrade pip "setuptools>=83.0.0"
          python -m pip install -r requirements-test.txt
      - name: Run framework validation tests
        run: python -m pytest tests/test_validation.py -v
      - name: Run quantum consciousness tests
        run: python -m pytest tests/test_sovereign_flow.py -v
      - name: Run sacred geometry tests
        run: python -m pytest tests/test_sacred_geometry.py -v
      - name: Upload coverage report
        uses: codecov/codecov-action@v5
        with:
          files: ./coverage.xml
          fail_ci_if_error: false
